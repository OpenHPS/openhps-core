name: CI

on:
    push:
        branches: [master, dev]
    pull_request:
        branches: [master, dev]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    ci:
        uses: OpenHPS/workflows/.github/workflows/module.yml@v1
        secrets: inherit
        with:
            prebuild-script: 'build:three'
            run-size-limit: true
            graphviz: true
